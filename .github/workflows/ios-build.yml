name: ios-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # để tạo GitHub Release khi push tag v*

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test engine package
        run: swift test --package-path engine

  host-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ios-build:
    needs: [engine-tests, host-typecheck]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      APP: build/Build/Products/Release-iphoneos/Kyx.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Xcode version
        run: xcodebuild -version

      - name: Prebuild native project (+ pod install)
        run: npx expo prebuild -p ios --clean

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Kyx.xcworkspace \
            -scheme Kyx \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 300
          test -d "$APP/PlugIns/KyxKeyboard.appex"

      # Bản build không ký sẽ không mang entitlements. Ký ad-hoc kèm entitlements
      # để ESign có thể đọc lại App Group khi ký lại (cần xác nhận ở M0).
      - name: Ad-hoc sign with entitlements
        run: |
          set -e
          find "$APP" -name "*.framework" -o -name "*.dylib" | while read -r f; do
            codesign -f -s - "$f"
          done
          codesign -f -s - --entitlements ios/.targets/KyxKeyboard/generated.entitlements "$APP/PlugIns/KyxKeyboard.appex"
          codesign -f -s - --entitlements ios/Kyx/Kyx.entitlements "$APP"
          echo "--- app entitlements"; codesign -d --entitlements - "$APP"
          echo "--- keyboard entitlements"; codesign -d --entitlements - "$APP/PlugIns/KyxKeyboard.appex"

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Kyx.ipa Payload
          ls -la Kyx.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kyx-ipa
          path: out/Kyx.ipa

      - name: GitHub Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Kyx.ipa
